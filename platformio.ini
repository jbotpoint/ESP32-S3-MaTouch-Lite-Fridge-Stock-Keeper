[env:matouch-lite]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ============================================================
; MaTouch Lite ESP32-S3 memory configuration
;
; The board has 16 MB Flash + 8 MB OPI PSRAM.
; Without the OPI PSRAM configuration, ESP.getPsramSize()
; previously reported 0 bytes.
; ============================================================

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L

upload_port = COM3
monitor_port = COM3

build_flags =
#    -DCLEAR_FLASH_ON_BOOT
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED
    -include "include/User_Setup.h"

; Makerfabs recommends a 16 MB partition configuration.
board_build.partitions = default_16MB.csv

lib_deps =
    bodmer/TFT_eSPI
    bblanchon/ArduinoJson@^6.21.5